      function scrollSavedEnd() { const p = grid && grid.querySelector('.icon-saved'); if (p) p.scrollTop = p.scrollHeight; }   // a new tile appends at the BOTTOM of a scrolling panel — reveal it so the save visibly registers
      function saveCurrent() {   // one click = exactly one save (re-entry guard), rendered via a full build (reliable repaint)
        if (inSave) return;
        inSave = true;
        try {
          savedSet.push(snapshotState()); persistSet();
          refreshSaved();                                           // build() — re-renders the panel incl. the new tile
          scrollSavedEnd(); requestAnimationFrame(scrollSavedEnd);  // reveal the just-added tile (it lands at the bottom of the scroll)
        } finally { inSave = false; }
      }
      function deleteSaved(id) { savedSet = savedSet.filter(x => x.id !== id); tileCache.delete(id); if (insituOverride && insituOverride.id === id) { insituOverride = null; renderInsitu(); } persistSet(); refreshSaved(); }
      function clearSet() { if (!savedSet.length || !confirm('Clear all saved icons?')) return; savedSet = []; tileCache.clear(); insituOverride = null; persistSet(); refreshSaved(); }
      function renameSaved(id, name) { const it = savedSet.find(x => x.id === id); if (it) { it.name = name || 'icon'; persistSet(); } }
      function downloadSet() {
        savedSet.forEach((item, i) => setTimeout(() => {
          const a = document.createElement('a');
          a.download = (item.name || 'icon').trim().replace(/[^\w.-]+/g, '_') + '.png';
          a.href = DDSIcon.toDataURL(itemOpts(item, 512)); a.click();
        }, i * 200));
      }
      function renderSavedList() {
        if (!savedListEl) return;
        savedListEl.replaceChildren();
        if (!savedSet.length) {
          const e = document.createElement('div'); e.className = 'is-empty';
          e.textContent = 'No saved icons yet — design one and hit Save to start a set.';
          savedListEl.appendChild(e); return;
        }
        const pending = [];
        savedSet.forEach(item => {
          const card = document.createElement('div');
          card.className = 'is-card' + (insituOverride && insituOverride.id === item.id ? ' sel' : '');
          const img = document.createElement('img'); img.className = 'is-ic'; img.alt = item.name;
          const name = document.createElement('input'); name.className = 'is-name'; name.value = item.name; name.spellcheck = false;
          name.addEventListener('change', () => renameSaved(item.id, name.value));
          name.addEventListener('keydown', e => { if (e.key === 'Enter') name.blur(); });
          const del = document.createElement('button'); del.className = 'is-del'; del.innerHTML = '&times;'; del.title = 'Delete';
          del.addEventListener('click', e => { e.stopPropagation(); deleteSaved(item.id); });
          // Click a saved tile → show it in the in-situ panel (until the next edit creates a new one)
          card.addEventListener('click', e => {
            if (e.target.closest('.is-del') || e.target.closest('.is-name')) return;
            insituOverride = item; renderInsitu();
            savedListEl.querySelectorAll('.is-card.sel').forEach(c => c.classList.remove('sel'));
            card.classList.add('sel');
          });
          card.append(del, img, name); savedListEl.appendChild(card);
          const url = tileCache.get(item.id);
          if (url) img.src = url;
          else pending.push({ item, img });   // uncached → render AFTER paint (toDataURL is a blocking physics settle)
        });
        // Render new thumbnails off the paint, one per tick, so a save shows its tile INSTANTLY (no click freeze).
        if (pending.length && window.DDSIcon) {
          let i = 0;
          const step = () => {
            if (i >= pending.length) return;
            const { item, img } = pending[i++];
            const u = DDSIcon.toDataURL(Object.assign(itemOpts(item, 96), { background: 'transparent' }));
            tileCache.set(item.id, u); if (img.isConnected) img.src = u;
            if (i < pending.length) setTimeout(step, 0);
          };
          setTimeout(step, 0);
        }
      }

      // In-situ: paint the current icon (transparent) into the context elements
      // Debounced + memoised: toDataURL is a BLOCKING physics settle (~150ms+), and this is wired to
      // high-frequency events (colour-wheel drag, name keystrokes). Coalesce to a 120ms trailing edge,
      // skip when the state hasn't actually changed, and never render into a torn-down panel.
      let insituT = 0, insituKey = '';
      function renderInsitu() {
        clearTimeout(insituT);
        insituT = setTimeout(() => {
          if (!insituEls || !insituEls.length || !insituEls[0].isConnected || !window.DDSIcon) return;
          const opts = Object.assign({}, insituOverride ? itemOpts(insituOverride, 128) : iconState, { background: 'transparent', size: 128 });
          const key = JSON.stringify(opts);
          if (key === insituKey) return;
          insituKey = key;
          const url = DDSIcon.toDataURL(opts);
          insituEls.forEach(img => { img.src = url; });
        }, 120);
      }

      function iconsComposition(cols, rows) {
        const items = [];
        if (cols >= 7) {
          // Draggable cards: preview (left) · saved (right) · example-usage. The controls toolbar and the
          // action pill are SATELLITES that float beside their card (preview / saved) — not grid cards.
          const lw = 3, maxSW = 3;
          const { oy, h } = vSpace(rows);              // free scaffold rows top & bottom
          const ph = Math.min(3, Math.max(2, h - 2));  // preview ≥2 rows so the icon reads large & centred
          const sz = savedPanelSize(savedSet.length, cols, rows);
          savedLayout = { w: sz.w, h: sz.h };
          const ox = Math.max(0, Math.floor((cols - (lw + 1 + maxSW)) / 2));   // centre: preview | gap | saved
          const clampAnchor = (a, w, hh) => ({ c: clampInt(a.c, 0, cols - w), r: clampInt(a.r, 0, rows - hh) });
          // The "Example usage" mockup (list + cards + size-scale) needs ~2 rows or `overflow:hidden` clips it.
          // Take those rows from the space BELOW the preview (incl. bottom breathing) rather than the tight
          // content budget — and if the viewport is too short to show it uncut, render it minimized instead.
          const situRoom = Math.max(0, rows - (oy + ph));   // whole rows below the preview, down to the grid bottom
          const SITU_ROWS = 2;
          const situC = !!viewLayout.situHidden || situRoom < SITU_ROWS;
          const situH = situC ? 1 : Math.min(SITU_ROWS, situRoom);
          const situW = situC ? 1 : lw;
          const gp  = viewLayout.preview  ? clampAnchor(viewLayout.preview, lw, ph)     : { c: ox, r: oy };
          const gsi = viewLayout.situ     ? clampAnchor(viewLayout.situ, situW, situH)  : { c: ox, r: oy + ph };
          const gs  = viewLayout.saved    ? clampAnchor(viewLayout.saved, sz.w, sz.h)   : { c: ox + lw + 1, r: oy };
          const situShown = !situC && situH > 0 && gsi.r + situH <= rows;
          const rx = ox + lw + 1 + maxSW + 1;
          const gin = viewLayout.info ? clampAnchor(viewLayout.info, 1, 1) : { c: rx, r: oy };
          const gap = viewLayout.api  ? clampAnchor(viewLayout.api, 1, 1)  : { c: rx, r: oy + 1 };
          const rects = [{ id: 'preview', c: gp.c, r: gp.r, w: lw, h: ph }, { id: 'saved', c: gs.c, r: gs.r, w: sz.w, h: sz.h },
            { id: 'info', c: gin.c, r: gin.r, w: 1, h: 1 }, { id: 'api', c: gap.c, r: gap.r, w: 1, h: 1 }];
          if (situShown) rects.push({ id: 'situ', c: gsi.c, r: gsi.r, w: situW, h: situH });
          else if (situC) rects.push({ id: 'situ', c: gsi.c, r: gsi.r, w: 1, h: 1 });
          boardFloor = oy;
          resolveLayout(rects, null, cols, rows, oy);
          const R = Object.fromEntries(rects.map(x => [x.id, x]));
          items.push({ group: 'content', kind: 'iconpreview', c: R.preview.c, r: R.preview.r, w: lw, h: ph, tag: 'Preview', tagPos: 'above', drag: 'preview' });
          items.push({ group: 'content', kind: 'iconcontrols', satellite: true });   // floats beside the preview
          if (R.situ) items.push({ group: 'content', kind: 'iconsitu', c: R.situ.c, r: R.situ.r, w: situC ? 1 : situW, h: situC ? 1 : situH, tag: 'Example usage', tagPos: 'above', drag: 'situ', collapsed: situC });
          items.push({ group: 'content', kind: 'iconsaved', c: R.saved.c, r: R.saved.r, w: sz.w, h: sz.h, tag: 'Saved Set', tagPos: 'above', drag: 'saved' });
          // Info/API are cards too — their reveal EXPANDS them (pushing neighbours), so they must live in the collision layout.
          items.push({ group: 'content', kind: 'infocard', c: R.info.c, r: R.info.r, w: 1, h: 1, accent: true, icon: 'info', info: 'about', drag: 'info' });
          items.push({ group: 'content', kind: 'infocard', c: R.api.c,  r: R.api.r,  w: 1, h: 1, icon: 'code', info: 'api', drag: 'api' });
        } else {
          // Narrow / portrait — a plain vertical stack: preview (with footer) · controls toolbar (compact, centred) · saved.
          // HEIGHT-AWARE: the controls bar wins over the saved panel when only one row remains (the generator must
          // stay fully configurable on 3-row phones); at 2 rows the preview shrinks to 1 so controls still fit.
          const w = Math.min(cols, 3), ox = Math.floor((cols - w) / 2);
          let r = 0;
          const ph = rows >= 3 ? Math.max(2, Math.floor(rows * 0.4)) : 1;
          items.push({ group: 'content', kind: 'iconpreview', c: ox, r, w, h: ph }); r += ph;
          if (rows - r >= 1) { items.push({ group: 'content', kind: 'iconcontrols', c: ox, r, w, h: 1, inline: true }); r += 1; }
          if (rows - r > 0) {
            // Phone saved set: ¼-size tiles, 4 per cell — and CONTENT-SIZED: the panel is only as tall as the
            // tiles need (leftover rows stay scaffold; a sprawling empty surface read as a bug).
            const tileRows = Math.ceil(savedSet.length / (w * 2));            // tile rows used (2 tile-cols per cell)
            const needed = Math.max(1, Math.ceil(tileRows / 2));              // in grid cells (2 tile-rows per cell)
            items.push({ group: 'content', kind: 'iconsaved', c: ox, r, w, h: Math.min(rows - r, needed), dense: true });
          }
        }
        return items.filter(it => it.satellite || (it.c >= 0 && it.r >= 0 && it.c + it.w <= cols && it.r + it.h <= rows));
      }

      let lottieAnim = null, lottieHostEl = null;
      function mountLottie(host) {
        if (!host) { if (lottieAnim) lottieAnim.pause(); return; }   // a view without the hero: keep the instance, just stop the rAF work
        if (lottieAnim && host === lottieHostEl && host.querySelector('svg')) {   // persistent host moved intact — skip the 830KB re-parse
          if (!reduceMotion) lottieAnim.play();
          return;
        }
        if (lottieAnim) { try { lottieAnim.destroy(); } catch (e) {} lottieAnim = null; }
        if (window.lottie) {
          const o = { container: host, renderer: 'svg', loop: !reduceMotion, autoplay: !reduceMotion, rendererSettings: { preserveAspectRatio: 'xMidYMid meet' } };
          if (window.HERO_LOTTIE) o.animationData = window.HERO_LOTTIE; else o.path = './HeroLottie5.json';

      });

      function dotImage(c) {
        const r = c < 110 ? 1 : 1.5, n = 7, sp = c / (n + 1); let d = '';

        return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${c}' height='${c}'>${d}</svg>`)}")`;
      }

      function renderContent(el, it) {

          foot.querySelector('#ipRand').addEventListener('click', () => { iconState.seed = Math.random().toString(36).slice(2, 9); name.value = iconState.seed; refreshIcon(); });
          foot.querySelector('#ipSave').addEventListener('click', saveCurrent);
          foot.querySelector('#ipDl').addEventListener('click', () => { if (!iconInstance) return; const a = document.createElement('a'); a.download = (iconState.seed || 'icon').trim().replace(/[^\w.-]+/g, '_') + '.png'; a.href = iconInstance.toDataURL(512); a.click(); });

              eb.style.top = Math.round(it.r * gcw + du) + 'px';
              if (leftFree) eb.style.left = Math.round(it.c * gcw + 3 - eb.offsetWidth) + 'px';
              else eb.style.left = Math.round((it.c + it.w) * gcw - 3) + 'px';
            }
          }
          if (it.tagOn === 'hover') {
            el.addEventListener('mouseenter', () => eb.classList.add('show'));
            el.addEventListener('mouseleave', () => eb.classList.remove('show'));
          }
          if (it.drag) {   // the title tab is the drag handle for its module
            eb.classList.add('eb-handle'); eb.dataset.drag = it.drag;
            eb.dataset.bc = it.c; eb.dataset.br = it.r;   // build-time cell — all eyebrow transforms are computed against THIS (never against mutated baseCells)
            eb.addEventListener('pointerdown', e => startCardDrag(e, it.drag));
          }
        }
        syncEyebrowTucks();   // restored layouts may start with cards flush — tabs begin tucked, no first-paint sliver

        // Journal: the chunk spine — a TAG attached to the article's left edge (2 dot-units wide, right edge
        // tucked behind the card). One blue dot per chunk; the bigger indicator blob shares the goo-filtered
        // layer so it MELTS through the dots as it travels. A one-chunk article shows no spine.
        if (view === 'journal' && journalMode === 'read') {
          const art = items.find(i => i.kind === 'scrolltext' && i.journal);
          const artEl = grid.querySelector('.scrolltext');
          const entry = JOURNAL_ENTRIES[curEntry];
          if (curChunk >= entry.chunks.length) curChunk = 0;
          renderJournalMedia(curChunk, false);   // first paint — must run post-mount (isConnected guard)
          const n = entry.chunks.length;
          const mkSpine = horizontal => {   // shared builder: vertical tag on the article (desktop) / horizontal tag on the media panel (phone)
            const toc = document.createElement('div'); toc.className = 'jr-toc' + (horizontal ? ' jr-toc-h' : '');
            const thick = Math.round(cell / 4), mid = Math.round(thick / 2), pad2 = 16, len = pad2 * 2 + JR_DOT_GAP * (n - 1);
            const W = horizontal ? len : thick, H = horizontal ? thick : len;
            toc.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><g filter="url(#goo)">` +
              entry.chunks.map((s, i) => `<circle class="jr-dot" data-i="${i}" cx="${horizontal ? pad2 + JR_DOT_GAP * i : mid}" cy="${horizontal ? mid : pad2 + JR_DOT_GAP * i}" r="3.5"><title>${esc(s.heading)}</title></circle>`).join('') +
              `<circle class="jr-blob" cx="${horizontal ? pad2 : mid}" cy="${horizontal ? mid : pad2}" r="7"/></g></svg>`;
            toc.querySelectorAll('.jr-dot').forEach(d => d.addEventListener('click', () => {
              const sec = artEl.querySelector(`.jr-chunk[data-chunk="${d.dataset.i}"]`);
              if (sec) artEl.scrollTo({ top: Math.max(0, sec.offsetTop - 16), behavior: 'smooth' });
            }));
            return { toc, thick, len };
          };
          if (art && artEl && n > 1 && cols >= 7) {
            const { toc, thick } = mkSpine(false);
            toc.style.width = thick + 'px';
            toc.style.left = Math.round(art.c * gcw - thick + 3) + 'px';      // right edge tucks 3px behind the article (tag-style, z below the card)
            toc.style.top = Math.round(art.r * gcw + cell * 0.45) + 'px';
            grid.appendChild(toc); syncTocDots();
          } else if (art && artEl && n > 1) {
            const med = items.find(i => i.kind === 'journalmedia');
            if (med) {                                                        // phone: horizontal tag on the pinned panel's top edge
              const { toc, thick, len } = mkSpine(true);
              toc.style.height = thick + 'px';
              toc.style.left = Math.round(med.c * gcw + (med.w * cell + (med.w - 1) - len) / 2) + 'px';
              toc.style.top = Math.round(med.r * gcw - thick + 3) + 'px';     // bottom edge tucks behind the panel
              grid.appendChild(toc); syncTocDots();
            }
          }
        }

        // Drag ghost (snap-target preview) + reset — for ANY view that produced draggable cards (home or icons).
        if (grid.querySelector('.board-card')) {
          const ghost = document.createElement('div'); ghost.id = 'dragGhost'; grid.appendChild(ghost);
          if (Object.keys(viewLayout).length) {   // offer a reset once this board's been customised
            const rb = document.createElement('button'); rb.className = 'layout-reset';
            rb.innerHTML = '<span aria-hidden="true" class="material-symbols-rounded">restart_alt</span>Reset layout';
            rb.addEventListener('click', () => { viewLayout = layoutStores[CUR_LAYOUT_KEY] = {}; persistLayout(); build(); });
            grid.appendChild(rb);
          }
        }
        const savedItem = items.find(i => i.kind === 'iconsaved');
        if (savedItem && savedSet.length && lastCols >= 7) {   // floating pill only on desktop; narrow stacks instead
          const pill = document.createElement('div'); pill.className = 'dpill';
          const dl = document.createElement('button'); dl.className = 'dp-btn dl'; dl.title = 'Download all'; dl.setAttribute('aria-label', 'Download all'); dl.innerHTML = '<span aria-hidden="true" class="material-symbols-rounded">download</span>'; dl.addEventListener('click', downloadSet);
          const grip = document.createElement('div'); grip.className = 'dp-grip'; grip.title = 'Drag'; grip.innerHTML = '<div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>';
          const cl = document.createElement('button'); cl.className = 'dp-btn del'; cl.title = 'Clear'; cl.setAttribute('aria-label', 'Clear'); cl.innerHTML = '<span aria-hidden="true" class="material-symbols-rounded">delete</span>'; cl.addEventListener('click', clearSet);
          pill.append(dl, grip, cl);
          grip.addEventListener('pointerdown', e => startSatDrag(e, 'pill'));
          grid.appendChild(pill);
        }
        if (view === 'icons') positionSats();   // place both satellites (no-op for whichever isn't present)

        if (showHeatmap) {   // debug: notability = position (faint blue field) × isolation × visual impact (magenta on modules)
          const field = attentionField(cols, rows);
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            const h = document.createElement('div'); h.className = 'heat-cell';
            h.style.left = Math.round(c * gcw) + 'px'; h.style.top = Math.round(r * gcw) + 'px';
            h.style.width = Math.round(cell) + 'px'; h.style.height = Math.round(cell) + 'px';
            h.style.background = `rgba(51,102,255,${(field[r * cols + c] * 0.24).toFixed(3)})`;
            grid.appendChild(h);
          }
          for (const it of items) {
            if (it.group === 'float' || it.c == null) continue;
            const n = notabilityOf(it, field, occ, cols, rows), w = it.w || 1, hh = it.h || 1;
            const h = document.createElement('div'); h.className = 'heat-note';
            h.style.left = Math.round(it.c * gcw) + 'px'; h.style.top = Math.round(it.r * gcw) + 'px';
            h.style.width = Math.round(w * cell + (w - 1)) + 'px';
            h.style.height = Math.round(hh * cell + (hh - 1)) + 'px';
            h.style.background = `rgba(233,30,140,${(n * 0.72).toFixed(3)})`;
            h.textContent = n.toFixed(2);
            grid.appendChild(h);
          }
        }

        mountLottie(lottieHost);
        if (view === 'icons') mountIcon(iconHost);
        else if (iconInstance) { try { iconInstance.destroy(); } catch (e) {} iconInstance = null; iconCanvasEl = null; iconMountSize = 0; }   // leaving icons: drop the persistent canvas so re-entry mounts fresh
        if (typeof syncEditToggle === 'function') syncEditToggle();   // hide Edit where nothing is editable

        // Footer: just the mark. The readout is DEBUG telemetry (hidden unless #debug). This is a
        // computer-first site — the phone build stays lean, no content is relocated into the footer.
        const dbg = location.hash === '#debug';
        readout.style.display = dbg ? '' : 'none';
        readout.textContent = dbg ? `${LAYOUT_MODE}${showHeatmap ? ' · heat' : ''} · ${cols} × ${rows} · ${cell.toFixed(0)}px` : '';
      }

      /* ---- Populate: animate view → view (rail / logo / in-grid CTA) ---- */
      const POP_DUR = 280, POP_WINDOW = 160;
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const waitMs = ms => new Promise(r => setTimeout(r, ms));
      let transitioning = false, pendingView = null;

      function popStagger(els, reverse) {
        if (!els.length) return;
        const keys = els.map(e => (parseInt(e.style.gridRow) || 1) * 1000 + (parseInt(e.style.gridColumn) || 1));
        const min = Math.min(...keys), span = (Math.max(...keys) - min) || 1;
        els.forEach((e, i) => {
          let tt = (keys[i] - min) / span;
          if (reverse) tt = 1 - tt;
          e.style.transitionDelay = (tt * POP_WINDOW).toFixed(0) + 'ms';
        });
      }

      const VIEW_TITLES = { home: 'Doran Design Studio', about: 'About — Doran Design Studio', journal: 'Journal — Doran Design Studio', icons: 'Icons — Doran Design Studio', contact: 'Contact — Doran Design Studio' };
      function syncTitle() { document.title = VIEW_TITLES[view] || VIEW_TITLES.home; }
      async function transitionTo(newView) {
        if (newView === 'journal' && view !== 'journal') journalMode = 'gallery';   // the journal always OPENS on the cover gallery
        if (newView === view && !transitioning) return;
        if (transitioning) { pendingView = newView; return; }   // queue the latest click while busy
        if (reduceMotion) { view = newView; build(); syncTitle(); return; }
        transitioning = true;

        // EXIT — current content + shadows recede into the scaffold (reverse reading order).
        const old = [...grid.querySelectorAll('.block, .shadow-plate')];
        popStagger(old, true);
        old.forEach(e => e.classList.add('pop-out'));
        await waitMs(POP_WINDOW + POP_DUR + 20);

        // REBUILD the new view (scaffold stays put underneath).
        view = newView;
        build();
        syncTitle();

        // ENTER — new content drops & settles (reading order).
        const fresh = [...grid.querySelectorAll('.block, .shadow-plate')];
        fresh.forEach(e => e.classList.add('pop-in'));
        popStagger(fresh, false);
        void grid.offsetHeight;                       // commit the pre-enter state
        fresh.forEach(e => e.classList.remove('pop-in'));
        await waitMs(POP_WINDOW + POP_DUR + 20);
        fresh.forEach(e => { e.style.transitionDelay = ''; });

        transitioning = false;
        if (pendingView !== null && pendingView !== view) { const p = pendingView; pendingView = null; transitionTo(p); }
        else pendingView = null;
      }

      let t;
      addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => build({ fromResize: true }), 120); });
      // Debug: 'm' toggles set ↔ dynamic (attention-distributed), 'h' toggles the attention heatmap.
      // Gated behind #debug so a visitor brushing the keyboard can't scramble the page (ddsDebug stays live).
      addEventListener('keydown', e => {
        if (location.hash !== '#debug') return;
        if (/^(input|textarea)$/i.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key.toLowerCase();
        if (k === 'm') { LAYOUT_MODE = LAYOUT_MODE === 'set' ? 'dynamic' : 'set'; build(); }
        else if (k === 'h') { showHeatmap = !showHeatmap; build(); }
      });
      window.ddsDebug = { mode: m => { LAYOUT_MODE = m; build(); }, heat: v => { showHeatmap = !!v; build(); } };

      /* ===== In-place content editor (LOCAL — a Graffold/S3 stand-in). Edit a card's image/icon/text where it
         lives; edits persist to the per-view content store and patch the module object, not the code. ===== */
      function makePencil(title, onClick) {
        const p = document.createElement('button'); p.className = 'edit-pencil'; p.title = title;
        p.innerHTML = '<span aria-hidden="true" class="material-symbols-rounded">edit</span>';
        p.addEventListener('pointerdown', e => e.stopPropagation());   // don't start a card drag
        p.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); onClick(); });
        return p;
      }
      function addEditAffordance(el, it) {
        const sch = it.drag && MODULE_SCHEMA[it.kind];
        if (!sch || !sch.fields.length) return;
        el.appendChild(makePencil('Edit ' + sch.label, () => openEditor({
          label: sch.label, id: it.drag, fields: sch.fields, values: it,
          onSave(vals) { if (Object.keys(vals).length) contentStore[it.drag] = vals; else delete contentStore[it.drag]; persistContent(); build(); },
          onRevert() { delete contentStore[it.drag]; persistContent(); build(); }
        })));
      }
      function closeEditor() { ['editPop', 'editBackdrop'].forEach(id => { const n = document.getElementById(id); if (n) n.remove(); }); document.removeEventListener('keydown', editorKeys, true); }
      function editorKeys(e) {
        if (e.key === 'Escape') { e.stopPropagation(); closeEditor(); return; }
        if (e.key === 'Tab') {   // keep focus inside the dialog
          const pop = document.getElementById('editPop'); if (!pop) return;
          const f = [...pop.querySelectorAll('input, textarea, button')].filter(x => !x.disabled);
          if (!f.length) return;
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      }
      // Generic in-place editor: cfg = { label, id, fields:[{k,t}], values:{}, onSave(vals), onRevert() }.
      // Module cards wrap it via addEditAffordance; the journal builds its own cfgs (per-section markdown).
      function openEditor(cfg) {
        closeEditor();
        const bd = document.createElement('div'); bd.id = 'editBackdrop'; bd.addEventListener('click', closeEditor); document.body.appendChild(bd);
        const pop = document.createElement('div'); pop.id = 'editPop'; pop.className = 'edit-pop';
        pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-modal', 'true'); pop.setAttribute('aria-label', 'Edit ' + cfg.label);
        pop.innerHTML = `<div class="ep-head">Edit ${cfg.label} · <b>${cfg.id}</b></div>`;
        const form = document.createElement('div'); form.className = 'ep-body';
        const inputs = {};
        for (const f of cfg.fields) {
          const row = document.createElement('div'); row.className = 'ep-row';
          row.innerHTML = `<span class="ep-k">${f.k} · ${f.t}</span>`;
          let input;
          const cur = cfg.values[f.k];
          if (f.t === 'image') {
            input = document.createElement('input'); input.type = 'text'; input.placeholder = 'image path / URL (later: a Graffold asset ref)'; input.value = cur || '';
            const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*'; file.className = 'ep-file';
            file.addEventListener('change', () => { const fl = file.files[0]; if (!fl) return; const rd = new FileReader(); rd.onload = () => { input.value = rd.result; }; rd.readAsDataURL(fl); });
            row.append(input, file);
          } else if (f.t === 'markdown') {
            input = document.createElement('textarea'); input.rows = f.rows || 8; input.value = cur || ''; input.spellcheck = false; row.appendChild(input);
          } else {
            input = document.createElement('input'); input.type = 'text'; input.value = cur != null ? cur : '';
            input.placeholder = f.t === 'icon' ? 'material icon name' : f.t === 'color' ? 'var(--color-…) or #hex' : '';
            row.appendChild(input);
          }
          inputs[f.k] = input; form.appendChild(row);
        }
        pop.appendChild(form);
        const foot = document.createElement('div'); foot.className = 'ep-foot';
        const revert = document.createElement('button'); revert.className = 'ep-btn ep-revert'; revert.textContent = 'Revert'; revert.title = 'Remove all overrides for this module (back to the built-in content)';
        revert.addEventListener('click', () => { closeEditor(); cfg.onRevert && cfg.onRevert(); });
        const cancel = document.createElement('button'); cancel.className = 'ep-btn'; cancel.textContent = 'Cancel'; cancel.addEventListener('click', closeEditor);
        const save = document.createElement('button'); save.className = 'ep-btn ep-save'; save.textContent = 'Save';
        save.addEventListener('click', () => {
          // Store VERBATIM (including empty strings — clearing a field is a real edit); Revert removes the override.
          const vals = {};
          for (const f of cfg.fields) vals[f.k] = inputs[f.k].value.trim();
          closeEditor(); cfg.onSave(vals);
        });
        foot.append(revert, cancel, save); pop.appendChild(foot);
        document.body.appendChild(pop);
        document.addEventListener('keydown', editorKeys, true);
        const first = pop.querySelector('input, textarea'); if (first) first.focus();
      }
      // Edit toggle — flips the page into edit mode (reveals the per-card edit affordances).
      const editToggle = (function () {
        const t = document.createElement('button'); t.className = 'edit-toggle';
        t.innerHTML = '<span aria-hidden="true" class="material-symbols-rounded">edit</span><span class="et-label">Edit</span>';
        t.addEventListener('click', () => { editMode = !editMode; document.body.classList.toggle('editing', editMode); t.classList.toggle('on', editMode); if (!editMode) closeEditor(); });
        document.body.appendChild(t);
        return t;
      })();
      // Only offer Edit where something is editable (narrow phone layouts have no editable cards yet).
      function syncEditToggle() {
        const editable = !!grid.querySelector('.edit-pencil');
        editToggle.style.display = editable ? '' : 'none';
        if (!editable && editMode) { editMode = false; document.body.classList.remove('editing'); editToggle.classList.remove('on'); closeEditor(); }
      }

      build();
      loadContent();   // fetch content/manifest.json → replace the journal entries with the live markdown files
    })();
  </script>
</body>
</html>
