server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve JSON files with correct MIME type
    types {
        application/json json;
    }
    include /etc/nginx/mime.types;

    # A missing ASSET must 404, not fall through to index.html. Without this every miss returns
    # 200 text/html: <script src="CompetitionLottie.js"> executes the page as JS, and the r.ok
    # guards on content/*.json and content/*.md all PASS on a 200, so the journal and Work render
    # garbage or empty instead of failing loudly.
    location ~* \.(png|jpe?g|webp|svg|gif|mp4|css|js|mjs|json|md|woff2?|txt|xml|pdf|ico)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
