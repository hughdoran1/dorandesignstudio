<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Per-route share card. OG tags live in the SHARED <head> of the SPA, so every hash route
     (#/icons, #/work, …) serves the same preview. This is a real file at a real URL, so a
     crawler that fetches /icons/ gets THESE tags. People are bounced straight into the app.
     Interim: task #84 (pre-rendered per-view pages) replaces this with the full generated set. -->

<title>Icon generator — Doran Design Studio</title>
<meta name="description" content="A soft-body icon generator, dependency-free. The same word always makes the same icon, so any product or document can carry a unique mark with no asset to manage.">
<link rel="canonical" href="https://www.dorandesign.studio/#/icons">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Doran Design Studio">
<meta property="og:title" content="Icon generator — Doran Design Studio">
<meta property="og:description" content="A soft-body icon generator, dependency-free. The same word always makes the same icon, so any product or document can carry a unique mark with no asset to manage.">
<meta property="og:url" content="https://www.dorandesign.studio/#/icons">
<meta property="og:image" content="https://www.dorandesign.studio/share-card-icons.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Four soft-body shapes in red, yellow, green and blue on the studio's dot grid — one generated icon.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Icon generator — Doran Design Studio">
<meta name="twitter:description" content="A soft-body icon generator, dependency-free. The same word always makes the same icon.">
<meta name="twitter:image" content="https://www.dorandesign.studio/share-card-icons.png">
<meta name="twitter:image:alt" content="Four soft-body shapes in red, yellow, green and blue on the studio's dot grid — one generated icon.">

<!-- Crawlers read the tags above and stop. Browsers continue into the app. replace() keeps this
     out of history, so Back goes where the visitor came from, not into a redirect loop. -->
<script>location.replace('/#/icons');</script>
<meta http-equiv="refresh" content="0; url=/#/icons">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#E9E7E3; color:#5f5f61; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
</style>
</head>
<body>
  <p><a href="/#/icons" style="color:#2A52CC">Continue to the icon generator →</a></p>
</body>
</html>
