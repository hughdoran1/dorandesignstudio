<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="-apple-system,'SF Pro Display','Inter',system-ui,sans-serif">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="rgba(31,41,55,0.07)"/></pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(20,28,44,0.14)"/></filter>
    
  </defs>
  <rect x="0" y="0" width="400" height="400" fill="#FCFBF8"/>
  <rect x="0" y="0" width="400" height="400" fill="url(#dots)" opacity="0.5"/>
  
    <rect x="60" y="40" width="280" height="320" rx="8" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1" filter="url(#card)"/>
    <rect x="60" y="40" width="280" height="6" rx="3" fill="#0E93A8"/>
    <text x="80" y="74" fill="#0E93A8" font-size="10" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace" letter-spacing="0.12em" style="text-transform:uppercase">MRD · Technical spec</text>
    <text x="80" y="102" fill="#1F2937" font-size="22" font-weight="700">Meridian</text>
    <text x="80" y="122" fill="#8A94A3" font-size="10.5" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,monospace">MRD-8 · 182 × 240 × 61 mm</text>
    <line x1="80" y1="166" x2="320" y2="166" stroke="#EDEEF1"/>
      <text x="80" y="156" fill="#4B5563" font-size="11.5" font-weight="400">Zones</text>
      <text x="320" y="156" fill="#1F2937" font-size="11.5" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace" text-anchor="end">8 / 16 / 32</text><line x1="80" y1="196" x2="320" y2="196" stroke="#EDEEF1"/>
      <text x="80" y="186" fill="#4B5563" font-size="11.5" font-weight="400">Flow range</text>
      <text x="320" y="186" fill="#1F2937" font-size="11.5" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace" text-anchor="end">0.1 – 40 gpm</text><line x1="80" y1="226" x2="320" y2="226" stroke="#EDEEF1"/>
      <text x="80" y="216" fill="#4B5563" font-size="11.5" font-weight="400">Ingress</text>
      <text x="320" y="216" fill="#1F2937" font-size="11.5" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace" text-anchor="end">IP68 valve · IP54 box</text><line x1="80" y1="256" x2="320" y2="256" stroke="#EDEEF1"/>
      <text x="80" y="246" fill="#4B5563" font-size="11.5" font-weight="400">Comms</text>
      <text x="320" y="246" fill="#1F2937" font-size="11.5" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace" text-anchor="end">LoRa · Wi-Fi · BLE</text><line x1="80" y1="286" x2="320" y2="286" stroke="#EDEEF1"/>
      <text x="80" y="276" fill="#4B5563" font-size="11.5" font-weight="400">Supply</text>
      <text x="320" y="276" fill="#1F2937" font-size="11.5" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace" text-anchor="end">24 VAC / 9 VDC</text><line x1="80" y1="316" x2="320" y2="316" stroke="#EDEEF1"/>
      <text x="80" y="306" fill="#4B5563" font-size="11.5" font-weight="400">Temp</text>
      <text x="320" y="306" fill="#1F2937" font-size="11.5" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace" text-anchor="end">−20 – 60 °C</text>
    <g opacity="1">
      <text x="80" y="340" fill="#8A94A3" font-size="9" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,monospace" letter-spacing="0.08em" style="text-transform:uppercase">IEC/IEEE 82079-1</text>
      <circle cx="310" cy="336" r="9" fill="none" stroke="#0E93A8" stroke-width="1.5"/><path d="M306 336 l3 3 l5 -6" fill="none" stroke="#0E93A8" stroke-width="1.5"/>
    </g>
  
    <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" letter-spacing="0.06em">
      <text x="24" y="380" fill="#8A94A3" text-transform="uppercase">MRD · SPEC SHEET</text>
      <text x="376" y="380" fill="#0E93A8" text-anchor="end" font-weight="600">IFU</text>
    </g>
</svg>