<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="-apple-system,'SF Pro Display','Inter',system-ui,sans-serif">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="rgba(31,41,55,0.07)"/></pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(20,28,44,0.14)"/></filter>
    
  </defs>
  <rect x="0" y="0" width="400" height="400" fill="#FCFBF8"/>
  <rect x="0" y="0" width="400" height="400" fill="url(#dots)" opacity="0.5"/>
  
    <rect x="84" y="66" width="232" height="268" rx="6" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1" filter="url(#card)"/>
    <rect x="84" y="66" width="232" height="30" fill="#0E93A8"/>
    <text x="98" y="86" fill="#FFFFFF" font-size="13" font-weight="700">Meridian MRD-8</text>
    <text x="304" y="86" fill="#FFFFFF" font-size="11" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,monospace" text-anchor="end">EU</text>
    <text x="98" y="120" fill="#4B5563" font-size="10.5" font-weight="400">Conforms to EU directives</text>
    <text x="98" y="138" fill="#8A94A3" font-size="9.5" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,monospace">Model MRD · 24 VAC · IP66</text>
    
    
    <text x="98" y="322" fill="#1F2937" font-size="9.5" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,monospace" letter-spacing="0.14em">0000 MRD EU 001</text>
  
    <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" letter-spacing="0.06em">
      <text x="24" y="380" fill="#8A94A3" text-transform="uppercase">MRD · COMPLIANCE LABEL</text>
      <text x="376" y="380" fill="#0E93A8" text-anchor="end" font-weight="600">EU</text>
    </g>
</svg>